name = "ucai"
main = "src/worker.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/mcp", "/mcp/*"]
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "ucai"
database_id = "cdba9163-687e-4f92-8c2f-beb208ac24b0"
